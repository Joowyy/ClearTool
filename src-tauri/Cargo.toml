[package]
name = "cleartool"
version = "0.1.0"
description = "ClearTool — exploración, limpieza profunda y debloat para Windows 11"
authors = ["Jowy"]
edition = "2021"
rust-version = "1.78"

[lib]
# El sufijo `_lib` es necesario en Windows para que el nombre de la lib
# no colisione con el del binario (https://github.com/rust-lang/cargo/issues/8519).
name = "cleartool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# NOTA: las dependencias completas (thiserror, anyhow, tokio, windows-rs,
# winreg, windows-service, walkdir, chrono, uuid, regex, ts-rs, plugins
# adicionales) se irán añadiendo cuando cada módulo las necesite. Mantener
# el árbol de dependencias mínimo acelera el primer build y facilita auditar
# la superficie de código de terceros, cosa crítica para una app que toca
# registro y servicios.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
