[package]
name = "cleartool"
version = "0.1.0"
description = "ClearTool — exploración, limpieza profunda y debloat para Windows 11"
authors = ["Jowy"]
edition = "2021"
rust-version = "1.78"

[lib]
name = "cleartool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
chrono = "0.4"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"

# decorum: titlebar HTML custom conservando Snap Layouts de Win11.
# Solo disponible en Windows — en Linux usamos decoraciones nativas.
[target.'cfg(windows)'.dependencies]
tauri-plugin-decorum = "1"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_System_Restore",
  "Win32_System_Services",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_SystemInformation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Performance",
  "Win32_System_Wmi",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_RemoteDesktop",
  "Win32_System_LibraryLoader",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_RestartManager",
] }
winreg = "0.52"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
open = "5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "process"] }
once_cell = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
dunce = "1"
glob = "0.3"
sysinfo = "0.32"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
